version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cbsa-postgres
    environment:
      POSTGRES_DB: cbsa
      POSTGRES_USER: cbsa_admin
      POSTGRES_PASSWORD: cbsa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./schema/001_create_schema.sql:/docker-entrypoint-initdb.d/001_create_schema.sql
      - ./schema/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbsa_admin -d cbsa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
